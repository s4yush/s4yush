<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace}.bob{animation:bob 2.4s ease-in-out infinite}.scarf{transform-box:fill-box;transform-origin:0% 50%;animation:wave 1.4s ease-in-out infinite alternate}.tail{transform-box:fill-box;transform-origin:0% 50%;animation:wave 1.1s ease-in-out infinite alternate-reverse}.spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}.pop{animation:pop .6s cubic-bezier(.2,.7,.2,1) both}.glow{animation:glow 2.2s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes wave{from{transform:rotate(-6deg)}to{transform:rotate(9deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
