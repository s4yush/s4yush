<svg xmlns="http://www.w3.org/2000/svg" width="800" height="714" viewBox="0 0 800 714" role="img" aria-label="Code stats"><title>Code stats</title><defs><linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0d1117" stop-opacity="1"/><stop offset="100%" stop-color="#131b2e" stop-opacity="1"/></linearGradient><linearGradient id="card-accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#58a6ff" stop-opacity="1"/><stop offset="100%" stop-color="#bc8cff" stop-opacity="1"/></linearGradient><pattern id="card-dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern></defs><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Noto Sans','Helvetica Neue',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace}.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade .9s ease both}.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease both}.grow{transform-box:fill-box;transform-origin:left center;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}.ring{animation:ring 1.6s cubic-bezier(.2,.7,.2,1) both}.draw{stroke-dasharray:1;animation:draw 2.2s ease .3s both}.blink{animation:blink 1s steps(1) infinite}.pulse{animation:pulse 2s ease-in-out infinite}.twinkle{animation:twinkle 4s ease-in-out infinite}.flicker{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.6s ease-in-out infinite}.sweep{animation:sweep 4.5s linear infinite}.orb-a{animation:float-a 11s ease-in-out infinite alternate}.orb-b{animation:float-b 13s ease-in-out infinite alternate}.wave-a{animation:drift 30s linear infinite}.wave-b{animation:drift 20s linear infinite reverse}.wave-c{animation:drift 38s linear infinite}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes ring{from{stroke-dashoffset:100}to{stroke-dashoffset:var(--to)}}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}@keyframes flicker{0%,100%{transform:scale(1)}50%{transform:scale(1.1,1.06)}}@keyframes sweep{from{transform:translateX(0)}to{transform:translateX(940px)}}@keyframes float-a{from{transform:translate(0,0)}to{transform:translate(70px,22px)}}@keyframes float-b{from{transform:translate(0,0)}to{transform:translate(-60px,-18px)}}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1000px)}}.seg{animation:seg 1.2s cubic-bezier(.2,.7,.2,1) both}.bar{transform-box:fill-box;transform-origin:bottom;animation:bar .8s cubic-bezier(.2,.7,.2,1) both}.eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}@keyframes seg{from{stroke-dasharray:0 100}}@keyframes bar{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="800" height="714" rx="20" fill="url(#card-bg)"/><rect width="800" height="714" rx="20" fill="url(#card-dots)"/><rect x="0.5" y="0.5" width="799" height="713" rx="19.5" fill="none" stroke="#30363d"/><rect x="32" y="28" width="5" height="24" rx="2.5" fill="url(#card-accent)"/><text x="48" y="47" font-size="22" fill="#e6edf3" font-weight="700">Code Stats</text><text x="768" y="46" font-size="15" fill="#8b949e" font-weight="400" text-anchor="end">last 74 commits across your repos</text><g class="rise" style="animation-delay:0.00s"><rect x="32" y="84" width="234.67" height="92" rx="14" fill="#161b22" fill-opacity="0.9" stroke="#30363d"/><re