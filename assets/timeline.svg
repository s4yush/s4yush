<svg xmlns="http://www.w3.org/2000/svg" width="800" height="568" viewBox="0 0 800 568" role="img" aria-label="Journey timeline from 2026 to 2030"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#131b2e"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient></defs><rect width="800" height="568" rx="20" fill="url(#bg)" stroke="#30363d"/><rect x="32" y="28" width="5" height="24" rx="2.5" fill="url(#accent)"/><text x="53" y="47" fill="#e6edf3" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Journey</text><text x="768" y="46" text-anchor="end" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="15">5 milestones · 2026–2030</text><path d="M54 94V520" stroke="#30363d" stroke-width="2"/><g font-family="Segoe UI,Arial,sans-serif"><circle cx="54" cy="105" r="10" fill="#161b22" stroke="#58a6ff" stroke-width="2.5"/><text x="84" y="91" fill="#58a6ff" font-size="13" font-weight="700">2026</text><text x="84" y="115" fill="#e6edf3" font-size="19" font-weight="700">B.Tech CSE · First Year</text><text x="84" y="137" fill="#8b949e" font-size="14">Starting the degree journey and building strong fundamentals.</text><circle cx="54" cy="197" r="10" fill="#161b22" stroke="#bc8cff" stroke-width="2.5"/><text x="84" y="183" fill="#bc8cff" font-size="13" font-weight="700">2027</text><text x="84" y="207" fill="#e6edf3" font-size="19" font-weight="700">Second Year · Growing Skills</text><text x="84" y="229" fill="#8b949e" font-size="14">Learning, experimenting, and shipping useful projects.</text><circle cx="54" cy="289" r="10" fill="#161b22" stroke="#f778ba" stroke-width="2.5"/><text x="84" y="275" fill="#f778ba" font-size="13" font-weight="700">2028</text><text x="84" y="299" fill="#e6edf3" font-size="19" font-weight="700">Third Year · Building in Public</text><text x="84" y="321" fill="#8b949e" font-size="14">Turning ideas into polished projects and open-source work.</text><circle cx="54" cy="381" r="10" fill="#161b22" stroke="#ffa657" stroke-width="2.5"/><text x="84" y="367" fill="#ffa657" font-size="13" font-weight="700">2029</text><text x="84" y="391" fill="#e6edf3" font-size="19" font-weight="700">Fourth Year · Real Projects</text><text x="84" y="413" fill="#8b949e" font-size="14">Deepening engineering practice and preparing for the next chapter.</text><circle cx="54" cy="473" r="10" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/><text x="84" y="459" fill="#3fb950" font-size="13" font-weight="700">2030</text><text x="84" y="483" fill="#e6edf3" font-size="19" font-weight="700">Next Chapter · Projects &amp; Opportunities</text><text x="84" y="505" fill="#8b949e" font-size="14">Ready to contribute to ambitious products and useful engineering work.</text></g></svg>
