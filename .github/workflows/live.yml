name: Live Cards

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: output
          path: out
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build space and views cards
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python lib/space.py out
      - name: Publish to output branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          cd out
          [ -d .git ] || { git init -q -b output; git remote add origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -q -m "Update live cards"; git push -q origin HEAD:output; }
