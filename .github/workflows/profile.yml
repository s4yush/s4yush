name: Profile Assets

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - cloudflare/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROFILE_LOGIN: ${{ github.repository_owner }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline self-test (mock data, validates every SVG)
        run: python3 scripts/preview.py "$RUNNER_TEMP/preview"

      - name: Prepare views counter
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'schedule' }}
        run: python3 scripts/deploy_views.py

      - name: Deploy views counter
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'schedule' }}
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.toml

      - name: Generate assets
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USERNAME: ${{ secrets.LASTFM_USERNAME }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python3 scripts/build_assets.py

      - name: Generate contribution snake
        if: ${{ !cancelled() }}
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?palette=github-dark
            assets/snake-light.svg?palette=github-light

      - name: Validate generated SVGs
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import sys, pathlib, xml.etree.ElementTree as ET
          bad = []
          for path in sorted(pathlib.Path("assets").glob("*.svg")):
              try:
                  ET.parse(path)
              except ET.ParseError as error:
                  bad.append(f"{path}: {error}")
          print("\n".join(bad) or "all SVGs are well-formed")
          sys.exit(1 if bad else 0)
          PY

      - name: Commit changes
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: refresh profile assets"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "push attempt ${attempt} failed, retrying"; sleep $((attempt * 5))
            done
          fi
